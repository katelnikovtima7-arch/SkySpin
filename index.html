<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StarsFlip — монетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0A121F;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #0A121F;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 12px 20px;
            background: #0A121F;
            flex-shrink: 0;
        }
        .close-btn {
            color: #7F8FA4;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }
        .balance-block {
            text-align: right;
        }
        .balance-amount {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
        }
        .balance-label {
            font-size: 0.7rem;
            color: #5F738C;
        }
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 16px;
            overflow-y: auto;
            min-height: 0;
        }
        .coin-icon {
            font-size: 5rem;
            filter: drop-shadow(0 0 8px #2f9eff40);
        }
        .multiplier-badge {
            background: #111C2C;
            border-radius: 60px;
            padding: 6px 20px;
            border: 1px solid #2F4A6E;
        }
        .multiplier-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #66D4FF;
        }
        .multiplier-label {
            font-size: 0.65rem;
            color: #6F8FAC;
            text-align: center;
        }
        .stats-row {
            display: flex;
            gap: 20px;
            background: #0E1826;
            padding: 8px 24px;
            border-radius: 60px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
        }
        .stat-label {
            font-size: 0.65rem;
            color: #6F8FAC;
        }
        .choice-buttons {
            display: flex;
            gap: 16px;
            width: 100%;
            padding: 0 8px;
        }
        .choice {
            flex: 1;
            background: #111C2C;
            border: 1px solid #2F4A6E;
            border-radius: 60px;
            padding: 12px 0;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            color: #B8D0E8;
            cursor: pointer;
            transition: 0.1s;
        }
        .choice.selected {
            background: #1E4973;
            border-color: #66D4FF;
            color: white;
            box-shadow: 0 0 8px #2f9eff40;
        }
        .bet-section {
            background: #0E1826;
            border-radius: 60px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .bet-label {
            color: #7F8FA4;
            font-size: 0.75rem;
        }
        .bet-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bet-input {
            background: #111C2C;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            width: 70px;
            text-align: center;
            padding: 6px 0;
            border-radius: 40px;
        }
        .bet-input:focus {
            outline: none;
            box-shadow: 0 0 0 1px #2f9eff;
        }
        .bet-btn {
            background: #1E4973;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .bet-btn:active {
            transform: scale(0.94);
        }
        .play-btn {
            background: #2F9EFF;
            width: 100%;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.07s;
        }
        .play-btn:active {
            transform: scale(0.97);
        }
        .risk-panel {
            background: #0E1826;
            border-radius: 28px;
            padding: 12px;
            margin-top: 4px;
            text-align: center;
            width: 100%;
        }
        .hidden {
            display: none;
        }
        .current-multiplier {
            font-size: 1.5rem;
            font-weight: bold;
            color: #66D4FF;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .take-btn {
            flex: 1;
            background: #1E6B3E;
            border: none;
            border-radius: 60px;
            padding: 10px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .risk-btn {
            flex: 1;
            background: #2F9EFF;
            border: none;
            border-radius: 60px;
            padding: 10px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .bottom-nav {
            background: #0A121F;
            border-top: 1px solid #1E2E42;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 16px 18px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0.6;
            transition: 0.1s;
            cursor: pointer;
        }
        .nav-item.active {
            opacity: 1;
        }
        .nav-icon {
            font-size: 1.3rem;
        }
        .nav-label {
            font-size: 0.6rem;
            color: #B0C4DE;
        }
        .history {
            background: #0E1826;
            border-radius: 24px;
            margin: 6px 16px 0;
            padding: 8px;
            max-height: 85px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .history-item {
            background: #111C2C;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #B0C4DE;
        }
        .history-item.win { background: #1E6B3E; color: white; }
        .history-item.loss { background: #8B3A3A; color: white; }
        .history-item.take { background: #2F4A6E; color: white; }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="close-btn">✕ Закрыть</div>
        <div class="balance-block">
            <div class="balance-amount" id="balanceValue">1000</div>
            <div class="balance-label">⭐ STARS</div>
        </div>
    </div>

    <div class="game-area" id="gameArea">
        <!-- сюда динамически будет вставляться контент -->
    </div>

    <div class="history">
        <div class="history-list" id="historyList">
            <span class="history-item">⭐ Добро пожаловать</span>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" data-tab="coin">
            <div class="nav-icon">🪙</div>
            <div class="nav-label">Монетка</div>
        </div>
        <div class="nav-item" data-tab="cases">
            <div class="nav-icon">📦</div>
            <div class="nav-label">Кейсы</div>
        </div>
        <div class="nav-item" data-tab="leaders">
            <div class="nav-icon">🏆</div>
            <div class="nav-label">Лидеры</div>
        </div>
        <div class="nav-item" data-tab="profile">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Профиль</div>
        </div>
    </div>
</div>
<script>
    // ------------------- ОСНОВНЫЕ ПАРАМЕТРЫ -------------------
    let balance = 1000;
    let currentRound = 1;
    let winStreak = 0;
    let bet = 50;
    let userChoice = "ОРЕЛ";
    const MAX_BET = 1000;
    const BASE_MULTIPLIER = 1.95;

    let riskActive = false;
    let currentRiskMultiplier = 1.0;
    let currentRiskStake = 0;

    // DOM элементы
    const gameArea = document.getElementById('gameArea');
    const balanceEl = document.getElementById('balanceValue');
    const historyList = document.getElementById('historyList');

    function updateBalanceUI() {
        balanceEl.innerText = Math.floor(balance);
        saveGame();
    }

    function addHistory(text, type) {
        const item = document.createElement('div');
        item.className = 'history-item';
        if (type === 'win') item.classList.add('win');
        else if (type === 'loss') item.classList.add('loss');
        else if (type === 'take') item.classList.add('take');
        item.innerText = text;
        historyList.prepend(item);
        while (historyList.children.length > 10) historyList.removeChild(historyList.lastChild);
        saveGame();
    }

    function updateBetUI() {
        if (bet < 1) bet = 1;
        if (bet > MAX_BET) bet = MAX_BET;
        if (bet > balance) bet = balance;
        saveGame();
    }

    function setChoice(choice) {
        userChoice = choice;
        saveGame();
    }

    function resetRiskMode() {
        riskActive = false;
        currentRiskMultiplier = 1.0;
        currentRiskStake = 0;
        saveGame();
    }

    function takeProfit() {
        if (!riskActive) return;
        const winAmount = currentRiskStake;
        balance += winAmount;
        winStreak = 0;
        updateBalanceUI();
        addHistory(`✅ ЗАБРАЛ(А) ${winAmount} ⭐ (x${currentRiskMultiplier.toFixed(2)})`, 'take');
        resetRiskMode();
        currentRound++;
        renderCoinTab();
        saveGame();
    }

    function riskFlip() {
        if (!riskActive) return;
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        if (isWin) {
            currentRiskMultiplier *= BASE_MULTIPLIER;
            currentRiskStake = Math.floor(bet * currentRiskMultiplier);
            addHistory(`🪙 РИСК: ${result} ✅ ВЫИГРЫШ! МНОЖИТЕЛЬ ${currentRiskMultiplier.toFixed(2)}x`, 'win');
            winStreak++;
        } else {
            addHistory(`🪙 РИСК: ${result} ❌ ПРОИГРЫШ! ПОТЕРЯНО ${currentRiskStake} ⭐`, 'loss');
            winStreak = 0;
            resetRiskMode();
            currentRound++;
            renderCoinTab();
        }
        saveGame();
    }

    function firstFlip() {
        if (bet > balance) {
            addHistory(`❌ Не хватает Stars`, 'loss');
            return;
        }
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        if (isWin) {
            const winAmountRaw = Math.floor(bet * BASE_MULTIPLIER);
            riskActive = true;
            currentRiskMultiplier = BASE_MULTIPLIER;
            currentRiskStake = winAmountRaw;
            addHistory(`🪙 ${result} ✅ ВЫИГРЫШ! МОЖЕШЬ ЗАБРАТЬ ${winAmountRaw} ⭐`, 'win');
            winStreak++;
            renderCoinTab();
        } else {
            balance -= bet;
            updateBalanceUI();
            addHistory(`🪙 ${result} ❌ ПРОИГРЫШ -${bet} ⭐`, 'loss');
            winStreak = 0;
            currentRound++;
            renderCoinTab();
            if (balance <= 0) {
                addHistory(`💔 Банкротство`, 'loss');
            }
        }
        updateBetUI();
        saveGame();
    }

    function makeBet() {
        if (riskActive) return;
        if (bet < 1 || bet > balance) {
            addHistory(`⚠️ Некорректная ставка`, 'loss');
            return;
        }
        firstFlip();
    }

    // ------------------- ОТРИСОВКА ВКЛАДОК -------------------
    function renderCoinTab() {
        gameArea.innerHTML = `
            <div class="coin-icon">🪙</div>
            <div class="multiplier-badge">
                <div class="multiplier-value" id="multiplierValue">${BASE_MULTIPLIER.toFixed(2)}x</div>
                <div class="multiplier-label">множитель</div>
            </div>
            <div class="stats-row">
                <div class="stat"><div class="stat-value" id="roundNum">${currentRound}</div><div class="stat-label">РАУНД</div></div>
                <div class="stat"><div class="stat-value" id="winCountStat">${winStreak}</div><div class="stat-label">ВИНСТРИК</div></div>
            </div>
            <div class="choice-buttons">
                <div class="choice ${userChoice === 'ОРЕЛ' ? 'selected' : ''}" data-side="ОРЕЛ">🪙 ОРЁЛ</div>
                <div class="choice ${userChoice === 'РЕШКА' ? 'selected' : ''}" data-side="РЕШКА">🪙 РЕШКА</div>
            </div>
            <div class="bet-section">
                <span class="bet-label">СТАВКА</span>
                <div class="bet-control">
                    <button class="bet-btn" id="decBet">−</button>
                    <input type="number" id="betAmount" class="bet-input" value="${bet}" step="10">
                    <button class="bet-btn" id="incBet">+</button>
                </div>
                <button class="bet-btn" id="maxBet">MAX</button>
            </div>
            <button class="play-btn" id="playBtn">СДЕЛАТЬ СТАВКУ</button>
            <div class="risk-panel ${riskActive ? '' : 'hidden'}" id="riskPanel">
                <div class="current-multiplier" id="currentMultiplier">${currentRiskMultiplier.toFixed(2)}x</div>
                <div class="action-buttons">
                    <button class="take-btn" id="takeBtn">💰 ЗАБРАТЬ</button>
                    <button class="risk-btn" id="riskBtn">🔄 КРУТИТЬ</button>
                </div>
            </div>
        `;
        // события
        document.querySelectorAll('.choice').forEach(btn => {
            btn.addEventListener('click', () => {
                setChoice(btn.dataset.side);
                renderCoinTab();
            });
        });
        document.getElementById('decBet')?.addEventListener('click', () => {
            bet = Math.max(1, bet - 10);
            updateBetUI();
            renderCoinTab();
        });
        document.getElementById('incBet')?.addEventListener('click', () => {
            bet = Math.min(MAX_BET, bet + 10);
            if (bet > balance) bet = balance;
            updateBetUI();
            renderCoinTab();
        });
        document.getElementById('maxBet')?.addEventListener('click', () => {
            bet = Math.min(MAX_BET, balance);
            updateBetUI();
            renderCoinTab();
        });
        document.getElementById('betAmount')?.addEventListener('change', (e) => {
            let v = parseInt(e.target.value);
            if (isNaN(v)) v = 10;
            bet = Math.min(MAX_BET, Math.max(1, v));
            if (bet > balance) bet = balance;
            updateBetUI();
            renderCoinTab();
        });
        document.getElementById('playBtn')?.addEventListener('click', makeBet);
        document.getElementById('takeBtn')?.addEventListener('click', () => {
            takeProfit();
            renderCoinTab();
        });
        document.getElementById('riskBtn')?.addEventListener('click', () => {
            riskFlip();
            renderCoinTab();
        });
    }

    function renderCasesTab() {
        gameArea.innerHTML = `
            <div style="text-align: center; color: white; padding: 40px 20px;">
                <div style="font-size: 3rem;">📦</div>
                <div style="margin-top: 20px; font-size: 1.2rem;">Кейсы скоро</div>
                <div style="margin-top: 10px; font-size: 0.8rem; color: #7F8FA4;">Тут будут кейсы с наградами</div>
            </div>
        `;
    }

    function renderLeadersTab() {
        gameArea.innerHTML = `
            <div style="text-align: center; color: white; padding: 40px 20px;">
                <div style="font-size: 3rem;">🏆</div>
                <div style="margin-top: 20px; font-size: 1.2rem;">Таблица лидеров</div>
                <div style="margin-top: 10px; font-size: 0.8rem; color: #7F8FA4;">Скоро здесь будут лучшие игроки</div>
            </div>
        `;
    }

    function renderProfileTab() {
        gameArea.innerHTML = `
            <div style="text-align: center; color: white; padding: 40px 20px;">
                <div style="font-size: 3rem;">👤</div>
                <div style="margin-top: 20px; font-size: 1.2rem;">Профиль</div>
                <div style="margin-top: 10px; font-size: 0.8rem; color: #7F8FA4;">Баланс: ${Math.floor(balance)} ⭐</div>
                <div style="margin-top: 5px; font-size: 0.7rem; color: #5F738C;">ID: ${Math.floor(Math.random()*1000000)}</div>
            </div>
        `;
    }

    // ------------------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК -------------------
    const navItems = document.querySelectorAll('.nav-item');
    let currentTab = 'coin';

    function switchTab(tab) {
        if (riskActive) {
            addHistory(`⚠️ Сначала закончи игру (забери или прокрути)`, 'loss');
            return;
        }
        currentTab = tab;
        navItems.forEach(item => {
            if (item.dataset.tab === tab) item.classList.add('active');
            else item.classList.remove('active');
        });
        if (tab === 'coin') renderCoinTab();
        else if (tab === 'cases') renderCasesTab();
        else if (tab === 'leaders') renderLeadersTab();
        else if (tab === 'profile') renderProfileTab();
    }

    navItems.forEach(item => {
        item.addEventListener('click', () => switchTab(item.dataset.tab));
    });

    // ------------------- СОХРАНЕНИЕ -------------------
    function saveGame() {
        const save = {
            balance: balance,
            currentRound: currentRound,
            winStreak: winStreak,
            bet: bet,
            userChoice: userChoice,
            riskActive: riskActive,
            currentRiskMultiplier: currentRiskMultiplier,
            currentRiskStake: currentRiskStake
        };
        localStorage.setItem('StarsFlipSave', JSON.stringify(save));
    }

    function loadGame() {
        const saved = localStorage.getItem('StarsFlipSave');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                balance = data.balance ?? 1000;
                currentRound = data.currentRound ?? 1;
                winStreak = data.winStreak ?? 0;
                bet = data.bet ?? 50;
                userChoice = data.userChoice ?? "ОРЕЛ";
                riskActive = data.riskActive ?? false;
                currentRiskMultiplier = data.currentRiskMultiplier ?? 1.0;
                currentRiskStake = data.currentRiskStake ?? 0;
                updateBalanceUI();
                updateBetUI();
            } catch(e) {}
        }
        renderCoinTab();
    }

    document.querySelector('.close-btn')?.addEventListener('click', () => {
        alert('⭐ StarsFlip — играй честно, забирай выигрыш');
    });

    loadGame();
</script>
</body>
</html>
