<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>SkySpin</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:Arial,sans-serif;

    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

body{
    min-height:100vh;

    background:#081225;

    color:white;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

.top{
    display:flex;
    justify-content:space-between;

    padding:20px;
}

.profile,
.balance{

    background:#1b263b;

    padding:14px 22px;

    border-radius:22px;

    font-size:22px;

    box-shadow:
    0 0 15px rgba(0,0,0,.25);
}

.center{

    flex:1;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.wheel-area{

    position:relative;

    width:260px;
    height:260px;
}

#wheel{

    width:100%;
    height:100%;

    display:block;

    transition:
    transform 5s cubic-bezier(.17,.67,.2,1);
}

.pointer{

    position:absolute;

    top:-8px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:15px solid transparent;
    border-right:15px solid transparent;

    border-top:30px solid #2492ff;

    z-index:10;
}

.spin-btn{

    margin-top:35px;

    border:none;

    border-radius:30px;

    width:280px;

    height:95px;

    font-size:34px;

    font-weight:bold;

    background:#2492ff;

    color:white;

    transition:.2s;
    display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.spin-btn:active{

    transform:scale(.97);
}

.bottom{

    display:flex;

    justify-content:space-around;

    align-items:center;

    padding:20px;

    background:#131d30;

    border-top:
    1px solid #25334d;
}

.bottom div{

    font-size:24px;

    color:#8e99a8;
}

.active{

    color:#2492ff !important;
}

/* Окно выигрыша */

.popup{

    position:fixed;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    background:#1b263b;

    width:280px;

    padding:25px;

    border-radius:25px;

    text-align:center;

    z-index:9999;

    display:none;

    box-shadow:
    0 0 35px rgba(0,0,0,.45);
opacity:0;

transition:
transform .35s ease,
opacity .35s ease;

transform:
translate(-50%,-50%)
scale(.6); 
}
    

.popup-title{

    font-size:32px;

    font-weight:bold;

    margin-bottom:15px;
}

.popup-prize{

    font-size:42px;

    color:#2492ff;

    font-weight:bold;
}
    .popup-btn{

    margin-top:20px;

    border:none;

    background:#2492ff;

    color:white;

    padding:12px 25px;

    border-radius:15px;

    font-size:20px;
}

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    display:none;

    z-index:9998;
opacity:0;

transition:
opacity .3s ease; 
}
    #loader{
    position:fixed;
    inset:0;
    background:#081225;
    z-index:99999;
    display:flex;
    justify-content:center;
    align-items:center;
}

#loaderImage{
    width:100%;
    height:100%;
    object-fit:cover;
}
    .history{
    margin-top:20px;
    width:340px;
    background:#1b263b;
    border-radius:18px;
    padding:12px;
}
.{history-title
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
    color:#2492ff;
}
    #historyList{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    overflow:hidden;
}
    .history-item{
    background:#2492ff;
    color:white;
    padding:3px 6px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
    flex-shrink:0;
}
    .spin-main{
    font-size:34px;
    font-weight:900;
    line-height:1;
}

.spin-sub{
    font-size:12px;
    margin-top:4px;
    opacity:.8;
}



</style>
</head>

<body>
    <div id="loader">
    <img src="IMG_0864.jpeg" id="loaderImage">
</div>

<div class="top">
    <div class="profile">👤 Профиль</div>
    <div class="balance" id="balance">
        💎 0 TON
    </div>
</div>

<div class="center">

    <div class="wheel-area">
        <div class="pointer"></div>
        <img src="IMG_0854.png" id="wheel">
        <audio id="spinSound" src="wheel-of-fortune.mp3"></audio>
        <audio id="winSound" src="9f3d770d1446e6c.mp3"></audio>
    </div>

    <button class="spin-btn">
    <div>КРУТИТЬ</div>
    <span>бурмалду</span>
</button>
    <div class="history">
    
    <div id="historyList">
        Пока нет выигрышей
    </div>
</div>

</div>

<div class="bottom">
    <div class="active">🎲 Игра</div>
    <div>🏆 Топ</div>
    <div>👤 Профиль</div>
    <div>⚙️</div>
</div>

<div class="overlay"></div>

<div class="popup">

    <div class="popup-title">
        Выигрыш
    </div>

    <div class="popup-prize" id="prizeText">
        0 TON
    </div>

    <button class="popup-btn">
        ОК
    </button>

</div>

<script>

const wheel =
document.getElementById("wheel");

const button =
document.querySelector(".spin-btn");

const popup =
document.querySelector(".popup");

const overlay =
document.querySelector(".overlay");

const popupBtn =
document.querySelector(".popup-btn");

const prizeText =
document.getElementById("prizeText");
    const historyList =
document.getElementById("historyList");

const balanceText =
document.getElementById("balance");
    const spinSound =
document.getElementById("spinSound");
    const winSound =
document.getElementById("winSound");

let balance =
Number(localStorage.getItem("balance")) || 0;

balanceText.innerHTML =
`💎 ${balance} TON`;

let spinning = false;

let rotation = 0;
    let history =
JSON.parse(
localStorage.getItem("history")
) || [];

function updateHistory(){

    if(history.length === 0){

        historyList.innerHTML =
        "Пока нет выигрышей";

        return;
    }

    historyList.innerHTML =
        history
.map(x => `<span class="history-item">${x} TON</span>`)
.join("");
    
}

updateHistory();

/* сектора */

const prizes =
[30,0,2,1,10,0,5,1];

button.onclick = () => {

    if(spinning) return;
    spinSound.currentTime = 0;
spinSound.play();

    spinning = true;

    button.disabled = true;

    button.innerText =
    "КРУТИТСЯ...";

    const sector =
    Math.floor(Math.random()*8);

    const angle =
(sector * 45);
    rotation +=
2160 - angle;

    wheel.style.transform =
    `rotate(${rotation}deg)`;

    setTimeout(()=>{

        const normalized =
((rotation % 360) + 360) % 360;

const currentSector =
Math.floor(
(((360 - normalized) % 360) + 22.5) / 45
) % 8;
spinSound.pause();
spinSound.currentTime = 0;
const win =
prizes[currentSector];

history.unshift(win);

if(history.length > 4){
    history.pop();
}

localStorage.setItem(
"history",
JSON.stringify(history)
);

updateHistory();

        const oldBalance = balance;

balance += win;

const newBalance = balance;

if(win === 0){

    balanceText.innerHTML =
    `💎 ${balance} TON`;

    localStorage.setItem(
    "balance",
    balance
    );

}else{

    let current = oldBalance;

    const animation = setInterval(()=>{

        current++;

        balanceText.innerHTML =
        `💎 ${current} TON`;

        if(current >= newBalance){

            clearInterval(animation);

            localStorage.setItem(
            "balance",
            newBalance
            );

        }

    },40);

}

        prizeText.innerText =
        `${win} TON`;
        winSound.currentTime = 0;
winSound.play();
        if(navigator.vibrate){
    navigator.vibrate([200,100,200]);
}

 overlay.style.display = "block";
popup.style.display = "block";

setTimeout(()=>{

    overlay.style.opacity = "1";

    popup.style.opacity = "1";

    popup.style.transform =
    "translate(-50%,-50%) scale(1)";

},10);

        spinning = false;

        button.disabled = false;

        button.innerText =
        "КРУТИТЬ";

    },5000);

};
    popupBtn.onclick = () => {

    popup.style.opacity = "0";

    overlay.style.opacity = "0";

    popup.style.transform =
    "translate(-50%,-50%) scale(.6)";

    setTimeout(()=>{

        popup.style.display =
        "none";

        overlay.style.display =
        "none";

    },350);

};


    

document.addEventListener(
"gesturestart",
e=>e.preventDefault()
);
window.addEventListener("load",()=>{

    setTimeout(()=>{

        document.getElementById("loader")
        .style.display="none";

    },2500);

});
</script>

</body>
</html>
