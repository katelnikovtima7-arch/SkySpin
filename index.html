<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StarsFlip — монетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* запрет копирования текста */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            background: #0B1120;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .app {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #0B1120;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        /* верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 8px 20px;
            flex-shrink: 0;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #8B9DC3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .how-btn {
            color: #5A6E8A;
            font-size: 0.75rem;
            background: #1A2438;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
        }
        .balance-top {
            text-align: right;
        }
        .balance-top .amount {
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
        }
        .balance-top .label {
            font-size: 0.6rem;
            color: #5A6E8A;
        }
        /* центральная часть */
        .game-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 16px;
            flex-shrink: 0;
        }
        .stat-block {
            text-align: center;
        }
        .stat-block .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
        }
        .stat-block .label {
            font-size: 0.65rem;
            color: #5A6E8A;
        }
        /* главная монета вместо цифр */
        .main-coin {
            text-align: center;
            padding: 8px 0;
            flex-shrink: 0;
        }
        .main-coin img {
            width: 100px;
            height: 100px;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 0 8px #2f9eff40);
        }
        .coin-animation {
            animation: coinFlipAnim 0.3s ease-in-out;
        }
        @keyframes coinFlipAnim {
            0% { transform: scale(0.8) rotateY(0deg); opacity: 0.5; }
            50% { transform: scale(1.1) rotateY(180deg); }
            100% { transform: scale(1) rotateY(360deg); opacity: 1; }
        }
        .coin-area {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px 20px;
            flex-shrink: 0;
        }
        .coin-option {
            flex: 1;
            max-width: 160px;
            background: #1A2438;
            border: 1px solid #2A3A50;
            border-radius: 60px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
            color: #A0B4D0;
            cursor: pointer;
            transition: 0.1s;
        }
        .coin-option img {
            width: 28px;
            height: 28px;
        }
        .coin-option.selected {
            background: #2F9EFF;
            border-color: #2F9EFF;
            color: white;
        }
        .bet-panel {
            background: #0F1626;
            margin: 8px 16px;
            padding: 12px 16px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .bet-label {
            color: #7F8FA4;
            font-size: 0.8rem;
        }
        .bet-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bet-input {
            background: #1A2438;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            width: 90px;
            text-align: center;
            padding: 8px 0;
            border-radius: 40px;
        }
        .bet-input:focus {
            outline: none;
            box-shadow: 0 0 0 1px #2F9EFF;
        }
        .bet-btn {
            background: #2A3A50;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 12px 16px;
            flex-shrink: 0;
        }
        .take-btn {
            flex: 1;
            background: #2F9EFF;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
        }
        .risk-btn {
            flex: 1;
            background: #2A3A50;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
        }
        .play-btn {
            background: #2F9EFF;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 8px 16px;
            flex-shrink: 0;
        }
        .history-section {
            background: #0F1626;
            margin: 8px 16px;
            border-radius: 24px;
            padding: 10px;
            flex-shrink: 0;
            max-height: 110px;
            overflow-y: auto;
        }
        .history-title {
            font-size: 0.65rem;
            color: #5A6E8A;
            margin-bottom: 6px;
            padding-left: 8px;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-item {
            background: #1A2438;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            color: #A0B4D0;
        }
        .history-item.win { background: #1E6B3E; color: white; }
        .history-item.loss { background: #8B3A3A; color: white; }
        .history-item.take { background: #2F4A6E; color: white; }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #0B1120;
            border-top: 1px solid #1A2438;
            padding: 10px 16px 20px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0.5;
            cursor: pointer;
        }
        .nav-item.active {
            opacity: 1;
        }
        .nav-icon { font-size: 1.2rem; }
        .nav-label { font-size: 0.6rem; color: #A0B4D0; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="logo">StarsFlip</div>
        <div class="how-btn" id="howBtn">Как играть</div>
        <div class="balance-top">
            <div class="amount" id="balanceValue">1000</div>
            <div class="label">⭐ STARS</div>
        </div>
    </div>

    <div class="game-stats">
        <div class="stat-block">
            <div class="value" id="roundNum">1</div>
            <div class="label">РАУНД</div>
        </div>
        <div class="stat-block">
            <div class="value">x1.95</div>
            <div class="label">КЭФ</div>
        </div>
    </div>

    <!-- ГЛАВНАЯ МОНЕТА -->
    <div class="main-coin">
        <img src="IMG_0944-photos.png" alt="монета" id="mainCoinImg">
    </div>

    <div class="coin-area">
        <div class="coin-option" data-side="ОРЕЛ">
            <img src="IMG_0944-photos.png" alt="орёл"> ОРЁЛ
        </div>
        <div class="coin-option" data-side="РЕШКА">
            <img src="IMG_0945-photos.png" alt="решка"> РЕШКА
        </div>
    </div>

    <div class="bet-panel">
        <span class="bet-label">СТАВКА</span>
        <div class="bet-controls">
            <button class="bet-btn" id="decBet">−</button>
            <input type="number" id="betAmount" class="bet-input" value="50">
            <button class="bet-btn" id="incBet">+</button>
        </div>
    </div>

    <div class="action-buttons" id="actionButtons" style="display: none;">
        <button class="take-btn" id="takeBtn">ЗАБРАТЬ</button>
        <button class="risk-btn" id="riskBtn">КРУТИТЬ</button>
    </div>

    <button class="play-btn" id="playBtn">СДЕЛАТЬ СТАВКУ</button>

    <div class="history-section">
        <div class="history-title">📜 ИСТОРИЯ</div>
        <div class="history-list" id="historyList">
            <span class="history-item">⭐ Добро пожаловать в StarsFlip</span>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" data-tab="coin"><div class="nav-icon">🪙</div><div class="nav-label">Монетка</div></div>
        <div class="nav-item" data-tab="leaders"><div class="nav-icon">🏆</div><div class="nav-label">Лидеры</div></div>
        <div class="nav-item" data-tab="profile"><div class="nav-icon">👤</div><div class="nav-label">Профиль</div></div>
    </div>
</div>
<script>
    // ------------------- ОСНОВНЫЕ ПАРАМЕТРЫ -------------------
    let balance = 1000;
    let currentRound = 1;
    let winStreak = 0;
    let bet = 50;
    let userChoice = "ОРЕЛ";
    const MAX_BET = 1000;
    const BASE_MULTIPLIER = 1.95;

    let riskActive = false;
    let currentRiskMultiplier = 1.0;
    let currentRiskStake = 0;

    // DOM элементы
    const balanceEl = document.getElementById('balanceValue');
    const roundEl = document.getElementById('roundNum');
    const betInput = document.getElementById('betAmount');
    const historyList = document.getElementById('historyList');
    const playBtn = document.getElementById('playBtn');
    const actionButtons = document.getElementById('actionButtons');
    const takeBtn = document.getElementById('takeBtn');
    const riskBtn = document.getElementById('riskBtn');
    const mainCoinImg = document.getElementById('mainCoinImg');

    function updateBalanceUI() {
        balanceEl.innerText = Math.floor(balance);
        saveGame();
    }

    function addHistory(text, type) {
        const item = document.createElement('div');
        item.className = 'history-item';
        if (type === 'win') item.classList.add('win');
        else if (type === 'loss') item.classList.add('loss');
        else if (type === 'take') item.classList.add('take');
        item.innerText = text;
        historyList.prepend(item);
        while (historyList.children.length > 10) historyList.removeChild(historyList.lastChild);
        saveGame();
    }

    function updateBetUI() {
        if (bet < 1) bet = 1;
        if (bet > MAX_BET) bet = MAX_BET;
        if (bet > balance) bet = balance;
        betInput.value = bet;
        saveGame();
    }

    function setChoice(choice) {
        userChoice = choice;
        document.querySelectorAll('.coin-option').forEach(el => {
            if (el.dataset.side === choice) el.classList.add('selected');
            else el.classList.remove('selected');
        });
        saveGame();
    }

    // анимация монеты
    function animateCoin(result) {
        mainCoinImg.classList.remove('coin-animation');
        void mainCoinImg.offsetHeight;
        mainCoinImg.classList.add('coin-animation');
        if (result === 'ОРЕЛ') {
            mainCoinImg.src = 'IMG_0944-photos.png';
        } else {
            mainCoinImg.src = 'IMG_0945-photos.png';
        }
        setTimeout(() => {
            mainCoinImg.classList.remove('coin-animation');
        }, 300);
    }

    function resetRiskMode() {
        riskActive = false;
        actionButtons.style.display = 'none';
        playBtn.style.display = 'block';
        currentRiskMultiplier = 1.0;
        currentRiskStake = 0;
        saveGame();
    }

    function takeProfit() {
        if (!riskActive) return;
        const winAmount = currentRiskStake;
        balance += winAmount;
        winStreak = 0;
        updateBalanceUI();
        addHistory(`✅ ЗАБРАЛ(А) ${winAmount} ⭐ (x${currentRiskMultiplier.toFixed(2)})`, 'take');
        resetRiskMode();
        currentRound++;
        roundEl.innerText = currentRound;
        saveGame();
    }

    function riskFlip() {
        if (!riskActive) return;
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        animateCoin(result);
        if (isWin) {
            currentRiskMultiplier *= BASE_MULTIPLIER;
            currentRiskStake = Math.floor(bet * currentRiskMultiplier);
            addHistory(`🪙 РИСК: ${result} ✅ ВЫИГРЫШ! СУММА ${currentRiskStake} ⭐`, 'win');
            winStreak++;
        } else {
            addHistory(`🪙 РИСК: ${result} ❌ ПРОИГРЫШ! ПОТЕРЯНО ${currentRiskStake} ⭐`, 'loss');
            winStreak = 0;
            resetRiskMode();
            currentRound++;
            roundEl.innerText = currentRound;
        }
        saveGame();
    }

    function firstFlip() {
        if (bet > balance) {
            addHistory(`❌ Не хватает Stars`, 'loss');
            return;
        }
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        animateCoin(result);
        if (isWin) {
            const winAmountRaw = Math.floor(bet * BASE_MULTIPLIER);
            riskActive = true;
            currentRiskMultiplier = BASE_MULTIPLIER;
            currentRiskStake = winAmountRaw;
            actionButtons.style.display = 'flex';
            playBtn.style.display = 'none';
            addHistory(`🪙 ${result} ✅ ВЫИГРЫШ! МОЖЕШЬ ЗАБРАТЬ ${winAmountRaw} ⭐`, 'win');
            winStreak++;
        } else {
            balance -= bet;
            updateBalanceUI();
            addHistory(`🪙 ${result} ❌ ПРОИГРЫШ -${bet} ⭐`, 'loss');
            winStreak = 0;
            currentRound++;
            roundEl.innerText = currentRound;
            if (balance <= 0) {
                addHistory(`💔 Банкротство`, 'loss');
                playBtn.disabled = true;
            }
        }
        updateBetUI();
        saveGame();
    }

    function makeBet() {
        if (riskActive) return;
        if (bet < 1 || bet > balance) {
            addHistory(`⚠️ Некорректная ставка`, 'loss');
            return;
        }
        firstFlip();
    }

    // ------------------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК -------------------
    const navItems = document.querySelectorAll('.nav-item');
    let currentTab = 'coin';

    function renderLeadersTab() {
        document.querySelector('.game-stats').style.display = 'none';
        document.querySelector('.main-coin').style.display = 'none';
        document.querySelector('.coin-area').style.display = 'none';
        document.querySelector('.bet-panel').style.display = 'none';
        document.querySelector('.play-btn').style.display = 'none';
        document.querySelector('.action-buttons').style.display = 'none';
        document.querySelector('.history-section').style.display = 'none';
        
        let leadersDiv = document.getElementById('leadersContent');
        if (!leadersDiv) {
            leadersDiv = document.createElement('div');
            leadersDiv.id = 'leadersContent';
            leadersDiv.style.cssText = 'flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; gap:20px; overflow-y:auto; padding:20px;';
            leadersDiv.innerHTML = `
                <div style="font-size:3rem;">🏆</div>
                <div style="font-size:1.2rem;">Топ игроков</div>
                <div style="width:100%; max-width:300px; text-align:left;">
                    <div>1. Игрок_01 — 15000 ⭐</div>
                    <div>2. Игрок_02 — 12000 ⭐</div>
                    <div>3. Игрок_03 — 8900 ⭐</div>
                    <div>4. Игрок_04 — 5400 ⭐</div>
                    <div>5. Игрок_05 — 3200 ⭐</div>
                </div>
            `;
            document.querySelector('.app').appendChild(leadersDiv);
        } else {
            leadersDiv.style.display = 'flex';
        }
        const profileDiv = document.getElementById('profileContent');
        if (profileDiv) profileDiv.style.display = 'none';
    }

    function renderProfileTab() {
        document.querySelector('.game-stats').style.display = 'none';
        document.querySelector('.main-coin').style.display = 'none';
        document.querySelector('.coin-area').style.display = 'none';
        document.querySelector('.bet-panel').style.display = 'none';
        document.querySelector('.play-btn').style.display = 'none';
        document.querySelector('.action-buttons').style.display = 'none';
        document.querySelector('.history-section').style.display = 'none';
        
        let profileDiv = document.getElementById('profileContent');
        if (!profileDiv) {
            profileDiv = document.createElement('div');
            profileDiv.id = 'profileContent';
            profileDiv.style.cssText = 'flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; gap:20px;';
            profileDiv.innerHTML = `
                <div style="font-size:3rem;">👤</div>
                <div style="font-size:1.2rem;">Твой профиль</div>
                <div style="background:#1A2438; padding:16px 24px; border-radius:30px; text-align:center;">
                    <div>Баланс: ${Math.floor(balance)} ⭐</div>
                    <div>ID: ${Math.floor(Math.random()*1000000)}</div>
                    <div>Винстрик: ${winStreak}</div>
                </div>
            `;
            document.querySelector('.app').appendChild(profileDiv);
        } else {
            profileDiv.innerHTML = `
                <div style="font-size:3rem;">👤</div>
                <div style="font-size:1.2rem;">Твой профиль</div>
                <div style="background:#1A2438; padding:16px 24px; border-radius:30px; text-align:center;">
                    <div>Баланс: ${Math.floor(balance)} ⭐</div>
                    <div>ID: ${Math.floor(Math.random()*1000000)}</div>
                    <div>Винстрик: ${winStreak}</div>
                </div>
            `;
            profileDiv.style.display = 'flex';
        }
        const leadersDiv = document.getElementById('leadersContent');
        if (leadersDiv) leadersDiv.style.display = 'none';
    }

    function renderCoinTab() {
        document.querySelector('.game-stats').style.display = 'flex';
        document.querySelector('.main-coin').style.display = 'block';
        document.querySelector('.coin-area').style.display = 'flex';
        document.querySelector('.bet-panel').style.display = 'flex';
        document.querySelector('.history-section').style.display = 'block';
        if (!riskActive) {
            document.querySelector('.play-btn').style.display = 'block';
        }
        const leadersDiv = document.getElementById('leadersContent');
        if (leadersDiv) leadersDiv.style.display = 'none';
        const profileDiv = document.getElementById('profileContent');
        if (profileDiv) profileDiv.style.display = 'none';
    }

    function switchTab(tab) {
        if (riskActive) {
            addHistory(`⚠️ Сначала закончи игру (забери или прокрути)`, 'loss');
            return;
        }
        currentTab = tab;
        navItems.forEach(item => {
            if (item.dataset.tab === tab) item.classList.add('active');
            else item.classList.remove('active');
        });
        
        if (tab === 'coin') renderCoinTab();
        else if (tab === 'leaders') renderLeadersTab();
        else if (tab === 'profile') renderProfileTab();
    }

    navItems.forEach(item => {
        item.addEventListener('click', () => switchTab(item.dataset.tab));
    });

    // ------------------- СОХРАНЕНИЕ -------------------
    function saveGame() {
        const save = {
            balance: balance,
            currentRound: currentRound,
            winStreak: winStreak,
            bet: bet,
            userChoice: userChoice,
            riskActive: riskActive,
            currentRiskMultiplier: currentRiskMultiplier,
            currentRiskStake: currentRiskStake
        };
        localStorage.setItem('StarsFlipSave', JSON.stringify(save));
    }

    function loadGame() {
        const saved = localStorage.getItem('StarsFlipSave');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                balance = data.balance ?? 1000;
                currentRound = data.currentRound ?? 1;
                winStreak = data.winStreak ?? 0;
                bet = data.bet ?? 50;
                userChoice = data.userChoice ?? "ОРЕЛ";
                riskActive = data.riskActive ?? false;
                currentRiskMultiplier = data.currentRiskMultiplier ?? 1.0;
                currentRiskStake = data.currentRiskStake ?? 0;
                updateBalanceUI();
                updateBetUI();
                roundEl.innerText = currentRound;
                setChoice(userChoice);
                if (riskActive) {
                    actionButtons.style.display = 'flex';
                    playBtn.style.display = 'none';
                } else {
                    actionButtons.style.display = 'none';
                    playBtn.style.display = 'block';
                }
            } catch(e) {}
        }
        setChoice(userChoice);
        // восстанавливаем картинку монеты по умолчанию
        mainCoinImg.src = 'IMG_0944-photos.png';
    }

    // ------------------- СОБЫТИЯ -------------------
    document.getElementById('decBet').addEventListener('click', () => {
        bet = Math.max(1, bet - 10);
        updateBetUI();
    });
    document.getElementById('incBet').addEventListener('click', () => {
        bet = Math.min(MAX_BET, bet + 10);
        if (bet > balance) bet = balance;
        updateBetUI();
    });
    betInput.addEventListener('change', (e) => {
        let v = parseInt(e.target.value);
        if (isNaN(v)) v = 10;
        bet = Math.min(MAX_BET, Math.max(1, v));
        if (bet > balance) bet = balance;
        updateBetUI();
    });

    document.querySelectorAll('.coin-option').forEach(btn => {
        btn.addEventListener('click', () => setChoice(btn.dataset.side));
    });

    playBtn.addEventListener('click', makeBet);
    takeBtn.addEventListener('click', takeProfit);
    riskBtn.addEventListener('click', riskFlip);

    document.getElementById('howBtn').addEventListener('click', () => {
        alert(`⭐ STARSFLIP — игра на монетке\n\nПРАВИЛА:\n1. Сделай ставку и выбери ОРЁЛ или РЕШКА\n2. Если угадал → можешь ЗАБРАТЬ или КРУТИТЬ ДАЛЬШЕ\n3. При КРУТИТЬ множитель растёт, но при проигрыше теряешь всё\n4. Коэффициент 1.95 (комиссия 5%)\n\nИграй честно, удачи!`);
    });

    loadGame();
</script>
</body>
</html>
