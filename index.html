<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkySpin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#111827;
    color:white;
    display:flex;
    flex-direction:column;
}

/* Верх */
.top{
    display:flex;
    justify-content:space-between;
    padding:20px;
}

.profile,.balance{
    background:#1f2937;
    padding:14px 22px;
    border-radius:20px;
    font-size:22px;
}

/* Центр */
.center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.wheel-area{
    position:relative;
    width:320px;
    height:320px;
}

#wheel{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-top:30px solid #198cff;
    z-index:10;
}

/* Кнопка */
.spin-btn{
    margin-top:30px;
    border:none;
    border-radius:25px;
    padding:20px 60px;
    font-size:32px;
    font-weight:bold;
    background:#198cff;
    color:white;
}

/* Низ */
.bottom{
    display:flex;
    justify-content:space-around;
    padding:20px;
    background:#1a1f2b;
}

.bottom div{
    color:#8e99a8;
    font-size:24px;
}

.active{
    color:#198cff !important;
}
</style>
</head>

<body>

<div class="top">
    <div class="profile">👤 Профиль</div>
    <div class="balance">💎 0 TON</div>
</div>

<div class="center">

    <div class="wheel-area">
        <div class="pointer"></div>
        <img src="IMG_0854.png" id="wheel">
    </div>

    <button class="spin-btn">
        КРУТИТЬ
    </button>

</div>

<div class="bottom">
    <div class="active">🎲 Игра</div>
    <div>🏆 Топ</div>
    <div>👤 Профиль</div>
    <div>⚙️</div>
</div>

<script>
const wheel = document.getElementById("wheel");
const button = document.querySelector(".spin-btn");

let rotation = 0;

button.onclick = () => {
    rotation += 1800 + Math.random() * 1800;

    wheel.style.transition = "transform 4s ease-out";
    wheel.style.transform = `rotate(${rotation}deg)`;
};
</script>

</body>
</html>
