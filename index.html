<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StarsFlip — риск-монетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(145deg, #0a0c12 0%, #05070a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
        }
        .game-container {
            max-width: 520px;
            width: 100%;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(14px);
            border-radius: 48px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.35);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1.7rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd966, #ffaa33);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .how-btn {
            background: rgba(255,215,0,0.12);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.7rem;
            color: #ffdd88;
            cursor: pointer;
            transition: 0.1s;
        }
        .how-btn:active { transform: scale(0.96); }
        .balance-card {
            background: #0f121eb3;
            border-radius: 40px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .balance-label { color: #aaa; font-size: 0.7rem; letter-spacing: 1px; }
        .balance-value { font-size: 2.2rem; font-weight: bold; color: #FFD966; text-shadow: 0 2px 0 #7a5c00; }
        .balance-currency { font-size: 0.9rem; color: #ffcc77; }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            background: #080b12;
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }
        .info-item { text-align: center; }
        .info-label { font-size: 0.65rem; color: #aaa; }
        .info-value { font-size: 1.3rem; font-weight: bold; color: #ffdd88; }
        
        .bet-section {
            background: #0a0e18;
            border-radius: 48px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .bet-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .bet-label { color: #ffdd99; font-size: 0.8rem; }
        .bet-control {
            background: #1a1f2e;
            border-radius: 60px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bet-input {
            background: #0a0e18;
            border: none;
            color: #FFD966;
            font-size: 1.1rem;
            width: 90px;
            text-align: center;
            border-radius: 40px;
            padding: 6px 0;
            font-weight: bold;
        }
        .bet-input:focus { outline: none; box-shadow: 0 0 0 2px #ffaa44; }
        .bet-btn {
            background: #ffaa33;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            color: #1f1a0a;
        }
        .bet-btn:active { transform: scale(0.94); }
        
        .choice-area {
            background: #080b12;
            border-radius: 60px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .choice-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 12px; }
        .choice {
            flex: 1;
            background: #1a1f2e;
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 60px;
            padding: 14px 0;
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffdd99;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
        }
        .choice.selected { background: #ffaa33; color: #1a1a0a; border-color: #ffdd66; box-shadow: 0 0 10px rgba(255,200,0,0.5); }
        .choice:active { transform: scale(0.96); }
        
        .risk-panel {
            background: #0a0e18;
            border-radius: 48px;
            padding: 16px;
            margin-top: 8px;
            text-align: center;
        }
        .current-multiplier {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffcc55;
            margin: 8px 0;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 12px;
        }
        .action-btn {
            flex: 1;
            border: none;
            border-radius: 60px;
            padding: 14px 0;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.07s linear;
        }
        .action-btn:active { transform: scale(0.96); }
        .take-btn { background: #2a8b5c; color: white; }
        .risk-btn { background: #ffaa33; color: #1f1a0a; }
        .play-btn {
            background: #ffaa33;
            width: 100%;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #1f1a0a;
            cursor: pointer;
            margin-top: 8px;
        }
        .play-btn:active { transform: scale(0.97); }
        
        .history {
            background: #05080f;
            border-radius: 36px;
            padding: 12px;
            margin-top: 20px;
            max-height: 140px;
            overflow-y: auto;
        }
        .history-title { font-size: 0.7rem; color: #ffcc77; margin-bottom: 8px; padding-left: 8px; }
        .history-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .history-item {
            background: #13182a;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
            color: #ddd;
        }
        .history-item.win { background: #2a6b3f; color: #d4ffb0; }
        .history-item.loss { background: #6b2f2f; color: #ffbcbc; }
        .history-item.take { background: #3a6b8c; color: #c0e0ff; }
        footer { font-size: 0.6rem; text-align: center; color: #6a6a7a; margin-top: 20px; }
        @media (max-width: 480px) {
            .choice { font-size: 1rem; padding: 10px 0; }
            .bet-input { width: 70px; }
            .action-btn { padding: 10px 0; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="logo">⭐ STARSFLIP</div>
        <div class="how-btn" id="howBtn">❓ Риск-режим</div>
    </div>

    <div class="balance-card">
        <div class="balance-label">ТВОЙ БАЛАНС</div>
        <div class="balance-value" id="balanceValue">1000</div>
        <div class="balance-currency">⭐ STARS</div>
    </div>

    <div class="info-row">
        <div class="info-item"><div class="info-label">РАУНД</div><div class="info-value" id="roundNum">1</div></div>
        <div class="info-item"><div class="info-label">БАЗОВЫЙ КЭФ</div><div class="info-value">x1.95</div></div>
    </div>

    <div class="bet-section">
        <div class="bet-row">
            <span class="bet-label">СТАВКА (⭐)</span>
            <div class="bet-control">
                <button class="bet-btn" id="decBet">−</button>
                <input type="number" id="betAmount" class="bet-input" value="50" step="10">
                <button class="bet-btn" id="incBet">+</button>
            </div>
            <button class="bet-btn" id="maxBet">MAX</button>
        </div>
    </div>

    <div class="choice-area">
        <div style="font-size:0.8rem; color:#ffcc77;">ВЫБЕРИ СТОРОНУ</div>
        <div class="choice-buttons">
            <div class="choice" data-side="ОРЕЛ">🪙 ОРЁЛ</div>
            <div class="choice" data-side="РЕШКА">🪙 РЕШКА</div>
        </div>
    </div>

    <!-- Панель с текущим множителем и кнопками ЗАБРАТЬ / КРУТИТЬ -->
    <div class="risk-panel" id="riskPanel" style="display: none;">
        <div style="font-size:0.75rem; color:#ffcc77;">ТЕКУЩИЙ МНОЖИТЕЛЬ</div>
        <div class="current-multiplier" id="currentMultiplier">1.00x</div>
        <div class="action-buttons">
            <button class="action-btn take-btn" id="takeBtn">💰 ЗАБРАТЬ</button>
            <button class="action-btn risk-btn" id="riskBtn">🔄 КРУТИТЬ ДАЛЬШЕ</button>
        </div>
    </div>

    <button class="play-btn" id="playBtn">СДЕЛАТЬ СТАВКУ</button>

    <div class="history">
        <div class="history-title">📜 ИСТОРИЯ</div>
        <div class="history-list" id="historyList">
            <span class="history-item">⭐ Добро пожаловать в StarsFlip!</span>
        </div>
    </div>
    <footer>⚡ ЧЕСТНАЯ МОНЕТКА 50/50 | КОМИССИЯ 5%<br>🔥 ПРОИГРЫШ В РИСК-РЕЖИМЕ = ПОТЕРЯ ВСЕЙ ТЕКУЩЕЙ СТАВКИ</footer>
</div>

<script>
    // ----- ОСНОВНЫЕ ПАРАМЕТРЫ -----
    let balance = 1000;              // баланс в Stars
    let currentRound = 1;
    let bet = 50;                    // начальная ставка
    let userChoice = "ОРЕЛ";
    const MAX_BET = 1000;
    const BASE_MULTIPLIER = 1.95;    // базовый множитель (с учётом комиссии)

    // РИСК-РЕЖИМ (активен после первого выигрыша)
    let riskActive = false;          // true = игрок в режиме "крутить дальше"
    let currentRiskMultiplier = 1.0; // текущий накопленный множитель
    let currentRiskStake = 0;        // сумма, которая сейчас в игре (ставка * множитель)

    // DOM элементы
    const balanceEl = document.getElementById('balanceValue');
    const roundEl = document.getElementById('roundNum');
    const betInput = document.getElementById('betAmount');
    const historyList = document.getElementById('historyList');
    const playBtn = document.getElementById('playBtn');
    const riskPanel = document.getElementById('riskPanel');
    const currentMultiplierSpan = document.getElementById('currentMultiplier');
    const takeBtn = document.getElementById('takeBtn');
    const riskBtn = document.getElementById('riskBtn');

    // Обновление UI баланса
    function updateBalanceUI() {
        balanceEl.innerText = Math.floor(balance);
    }

    // Добавление записи в историю
    function addHistory(text, type) {   // type: 'win', 'loss', 'take'
        const item = document.createElement('div');
        item.className = 'history-item';
        if (type === 'win') item.classList.add('win');
        else if (type === 'loss') item.classList.add('loss');
        else if (type === 'take') item.classList.add('take');
        item.innerText = text;
        historyList.prepend(item);
        while (historyList.children.length > 14) historyList.removeChild(historyList.lastChild);
    }

    // Обновить отображение ставки
    function updateBetUI() {
        if (bet < 1) bet = 1;
        if (bet > MAX_BET) bet = MAX_BET;
        if (bet > balance) bet = balance;
        betInput.value = bet;
    }

    // Выбор стороны (орёл/решка)
    function setChoice(choice) {
        userChoice = choice;
        document.querySelectorAll('.choice').forEach(el => {
            if (el.dataset.side === choice) el.classList.add('selected');
            else el.classList.remove('selected');
        });
    }

    // Сброс риск-режима (после забора или проигрыша)
    function resetRiskMode() {
        riskActive = false;
        riskPanel.style.display = 'none';
        currentRiskMultiplier = 1.0;
        currentRiskStake = 0;
        playBtn.disabled = false;
        playBtn.style.opacity = '1';
    }

    // Забрать текущий выигрыш (фиксация)
    function takeProfit() {
        if (!riskActive) return;
        const winAmount = currentRiskStake;
        balance += winAmount;
        updateBalanceUI();
        addHistory(`✅ ЗАБРАЛ(А) ${winAmount} ⭐ (множитель ${currentRiskMultiplier.toFixed(2)}x)`, 'take');
        resetRiskMode();
        // увеличиваем раунд
        currentRound++;
        roundEl.innerText = currentRound;
    }

    // Риск-бросок (продолжить)
    function riskFlip() {
        if (!riskActive) return;
        // бросаем монетку
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        
        if (isWin) {
            // увеличиваем множитель
            currentRiskMultiplier *= BASE_MULTIPLIER;
            currentRiskStake = Math.floor(bet * currentRiskMultiplier);
            currentMultiplierSpan.innerText = currentRiskMultiplier.toFixed(2) + 'x';
            addHistory(`🪙 РИСК: ${result} ✅ ВЫИГРЫШ! МНОЖИТЕЛЬ ${currentRiskMultiplier.toFixed(2)}x`, 'win');
        } else {
            // проигрыш — теряем всё
            addHistory(`🪙 РИСК: ${result} ❌ ПРОИГРЫШ! ПОТЕРЯНО ${currentRiskStake} ⭐`, 'loss');
            resetRiskMode();
            currentRound++;
            roundEl.innerText = currentRound;
        }
    }

    // Новая игра (первый бросок)
    function firstFlip() {
        if (bet > balance) {
            addHistory(`❌ Не хватает Stars для ставки ${bet}`, 'loss');
            return;
        }
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        
        if (isWin) {
            const winAmountRaw = Math.floor(bet * BASE_MULTIPLIER);
            // Включаем риск-режим: текущая сумма в игре = winAmountRaw
            riskActive = true;
            currentRiskMultiplier = BASE_MULTIPLIER;
            currentRiskStake = winAmountRaw;
            currentMultiplierSpan.innerText = currentRiskMultiplier.toFixed(2) + 'x';
            riskPanel.style.display = 'block';
            playBtn.disabled = true;
            playBtn.style.opacity = '0.5';
            addHistory(`🪙 ${result} ✅ ВЫИГРЫШ! МОЖЕШЬ ЗАБРАТЬ ${winAmountRaw} ⭐ ИЛИ КРУТИТЬ ДАЛЬШЕ`, 'win');
        } else {
            // проигрыш — теряем ставку
            balance -= bet;
            updateBalanceUI();
            addHistory(`🪙 ${result} ❌ ПРОИГРЫШ -${bet} ⭐`, 'loss');
            currentRound++;
            roundEl.innerText = currentRound;
            if (balance <= 0) {
                addHistory(`💔 Банкротство. Перезагрузи страницу`, 'loss');
                playBtn.disabled = true;
            }
        }
        updateBetUI();
    }

    // Главный обработчик ставки
    function makeBet() {
        if (riskActive) return; // если уже в риск-режиме — кнопка недоступна
        if (bet < 1 || bet > balance) {
            addHistory(`⚠️ Некорректная ставка`, 'loss');
            return;
        }
        firstFlip();
    }

    // ---- СОБЫТИЯ ----
    document.getElementById('decBet').addEventListener('click', () => {
        bet = Math.max(1, bet - 10);
        updateBetUI();
    });
    document.getElementById('incBet').addEventListener('click', () => {
        bet = Math.min(MAX_BET, bet + 10);
        if (bet > balance) bet = balance;
        updateBetUI();
    });
    document.getElementById('maxBet').addEventListener('click', () => {
        bet = Math.min(MAX_BET, balance);
        updateBetUI();
    });
    betInput.addEventListener('change', (e) => {
        let v = parseInt(e.target.value);
        if (isNaN(v)) v = 10;
        bet = Math.min(MAX_BET, Math.max(1, v));
        if (bet > balance) bet = balance;
        updateBetUI();
    });

    document.querySelectorAll('.choice').forEach(btn => {
        btn.addEventListener('click', () => setChoice(btn.dataset.side));
    });

    playBtn.addEventListener('click', makeBet);
    takeBtn.addEventListener('click', takeProfit);
    riskBtn.addEventListener('click', riskFlip);

    // Информация "Как играть"
    document.getElementById('howBtn').addEventListener('click', () => {
        alert(`⭐ STARSFLIP — риск-монетка ⭐\n\n🎲 ПРАВИЛА:\n1. Сделай ставку и выбери сторону (Орёл/Решка).\n2. Если выиграл → можешь ЗАБРАТЬ выигрыш или КРУТИТЬ ДАЛЬШЕ.\n3. При КРУТИТЬ ДАЛЬШЕ множитель растёт, но при проигрыше теряешь ВСЁ.\n4. Комиссия 5% уже учтена в множителе x1.95.\n\n🔥 Играй ответственно, это демо.`);
    });

    // Инициализация
    setChoice("ОРЕЛ");
    updateBalanceUI();
    updateBetUI();
</script>
<script>
    // ----- ОСНОВНЫЕ ПАРАМЕТРЫ -----
    let balance = 1000;
    let currentRound = 1;
    let bet = 50;
    let userChoice = "ОРЕЛ";
    const MAX_BET = 1000;
    const BASE_MULTIPLIER = 1.95;

    let riskActive = false;
    let currentRiskMultiplier = 1.0;
    let currentRiskStake = 0;

    // ДОПОЛНИТЕЛЬНО: аудио (опционально, без внешних файлов)
    let audioEnabled = false;
    let audioContext = null;

    const balanceEl = document.getElementById('balanceValue');
    const roundEl = document.getElementById('roundNum');
    const betInput = document.getElementById('betAmount');
    const historyList = document.getElementById('historyList');
    const playBtn = document.getElementById('playBtn');
    const riskPanel = document.getElementById('riskPanel');
    const currentMultiplierSpan = document.getElementById('currentMultiplier');
    const takeBtn = document.getElementById('takeBtn');
    const riskBtn = document.getElementById('riskBtn');

    // ЗВУК (короткие beep без файлов)
    function playBeep(type) {
        if (!audioEnabled) return;
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            let frequency = type === 'win' ? 880 : 440;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = 0.15;
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
            oscillator.stop(audioContext.currentTime + 0.3);
        } catch(e) { console.log("audio error"); }
    }

    // СОХРАНЕНИЕ / ЗАГРУЗКА (localStorage)
    function saveGame() {
        const save = {
            balance: balance,
            currentRound: currentRound,
            bet: bet,
            userChoice: userChoice,
            riskActive: riskActive,
            currentRiskMultiplier: currentRiskMultiplier,
            currentRiskStake: currentRiskStake
        };
        localStorage.setItem('StarsFlipSave', JSON.stringify(save));
    }

    function loadGame() {
        const saved = localStorage.getItem('StarsFlipSave');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                balance = data.balance ?? 1000;
                currentRound = data.currentRound ?? 1;
                bet = data.bet ?? 50;
                userChoice = data.userChoice ?? "ОРЕЛ";
                riskActive = data.riskActive ?? false;
                currentRiskMultiplier = data.currentRiskMultiplier ?? 1.0;
                currentRiskStake = data.currentRiskStake ?? 0;
                if (riskActive) {
                    riskPanel.style.display = 'block';
                    currentMultiplierSpan.innerText = currentRiskMultiplier.toFixed(2) + 'x';
                    playBtn.disabled = true;
                    playBtn.style.opacity = '0.5';
                } else {
                    riskPanel.style.display = 'none';
                    playBtn.disabled = false;
                    playBtn.style.opacity = '1';
                }
                setChoice(userChoice);
                updateBalanceUI();
                updateBetUI();
                roundEl.innerText = currentRound;
            } catch(e) {}
        }
    }

    function updateBalanceUI() {
        balanceEl.innerText = Math.floor(balance);
        saveGame();
    }

    function addHistory(text, type) {
        const item = document.createElement('div');
        item.className = 'history-item';
        if (type === 'win') item.classList.add('win');
        else if (type === 'loss') item.classList.add('loss');
        else if (type === 'take') item.classList.add('take');
        item.innerText = text;
        historyList.prepend(item);
        while (historyList.children.length > 14) historyList.removeChild(historyList.lastChild);
        saveGame();
    }

    function updateBetUI() {
        if (bet < 1) bet = 1;
        if (bet > MAX_BET) bet = MAX_BET;
        if (bet > balance) bet = balance;
        betInput.value = bet;
        saveGame();
    }

    function setChoice(choice) {
        userChoice = choice;
        document.querySelectorAll('.choice').forEach(el => {
            if (el.dataset.side === choice) el.classList.add('selected');
            else el.classList.remove('selected');
        });
        saveGame();
    }

    function resetRiskMode() {
        riskActive = false;
        riskPanel.style.display = 'none';
        currentRiskMultiplier = 1.0;
        currentRiskStake = 0;
        playBtn.disabled = false;
        playBtn.style.opacity = '1';
        saveGame();
    }

    function takeProfit() {
        if (!riskActive) return;
        const winAmount = currentRiskStake;
        balance += winAmount;
        updateBalanceUI();
        addHistory(`✅ ЗАБРАЛ(А) ${winAmount} ⭐ (множитель ${currentRiskMultiplier.toFixed(2)}x)`, 'take');
        playBeep('win');
        resetRiskMode();
        currentRound++;
        roundEl.innerText = currentRound;
        saveGame();
    }

    function riskFlip() {
        if (!riskActive) return;
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        if (isWin) {
            currentRiskMultiplier *= BASE_MULTIPLIER;
            currentRiskStake = Math.floor(bet * currentRiskMultiplier);
            currentMultiplierSpan.innerText = currentRiskMultiplier.toFixed(2) + 'x';
            addHistory(`🪙 РИСК: ${result} ✅ ВЫИГРЫШ! МНОЖИТЕЛЬ ${currentRiskMultiplier.toFixed(2)}x`, 'win');
            playBeep('win');
        } else {
            addHistory(`🪙 РИСК: ${result} ❌ ПРОИГРЫШ! ПОТЕРЯНО ${currentRiskStake} ⭐`, 'loss');
            playBeep('loss');
            resetRiskMode();
            currentRound++;
            roundEl.innerText = currentRound;
        }
        saveGame();
    }

    function firstFlip() {
        if (bet > balance) {
            addHistory(`❌ Не хватает Stars для ставки ${bet}`, 'loss');
            return;
        }
        const result = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";
        const isWin = (result === userChoice);
        if (isWin) {
            const winAmountRaw = Math.floor(bet * BASE_MULTIPLIER);
            riskActive = true;
            currentRiskMultiplier = BASE_MULTIPLIER;
            currentRiskStake = winAmountRaw;
            currentMultiplierSpan.innerText = currentRiskMultiplier.toFixed(2) + 'x';
            riskPanel.style.display = 'block';
            playBtn.disabled = true;
            playBtn.style.opacity = '0.5';
            addHistory(`🪙 ${result} ✅ ВЫИГРЫШ! МОЖЕШЬ ЗАБРАТЬ ${winAmountRaw} ⭐ ИЛИ КРУТИТЬ ДАЛЬШЕ`, 'win');
            playBeep('win');
        } else {
            balance -= bet;
            updateBalanceUI();
            addHistory(`🪙 ${result} ❌ ПРОИГРЫШ -${bet} ⭐`, 'loss');
            playBeep('loss');
            currentRound++;
            roundEl.innerText = currentRound;
            if (balance <= 0) {
                addHistory(`💔 Банкротство. Перезагрузи страницу`, 'loss');
                playBtn.disabled = true;
            }
        }
        updateBetUI();
        saveGame();
    }

    function makeBet() {
        if (riskActive) return;
        if (bet < 1 || bet > balance) {
            addHistory(`⚠️ Некорректная ставка`, 'loss');
            return;
        }
        firstFlip();
    }

    // ---- ВКЛЮЧЕНИЕ ЗВУКА ПОСЛЕ ПЕРВОГО ТАПА (для автономности) ----
    function enableAudioOnFirstTap() {
        if (audioEnabled) return;
        audioEnabled = true;
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') audioContext.resume();
    }
    document.body.addEventListener('click', enableAudioOnFirstTap, { once: true });

    // ---- СОБЫТИЯ ----
    document.getElementById('decBet').addEventListener('click', () => {
        bet = Math.max(1, bet - 10);
        updateBetUI();
    });
    document.getElementById('incBet').addEventListener('click', () => {
        bet = Math.min(MAX_BET, bet + 10);
        if (bet > balance) bet = balance;
        updateBetUI();
    });
    document.getElementById('maxBet').addEventListener('click', () => {
        bet = Math.min(MAX_BET, balance);
        updateBetUI();
    });
    betInput.addEventListener('change', (e) => {
        let v = parseInt(e.target.value);
        if (isNaN(v)) v = 10;
        bet = Math.min(MAX_BET, Math.max(1, v));
        if (bet > balance) bet = balance;
        updateBetUI();
    });

    document.querySelectorAll('.choice').forEach(btn => {
        btn.addEventListener('click', () => setChoice(btn.dataset.side));
    });

    playBtn.addEventListener('click', makeBet);
    takeBtn.addEventListener('click', takeProfit);
    riskBtn.addEventListener('click', riskFlip);

    document.getElementById('howBtn').addEventListener('click', () => {
        alert(`⭐ STARSFLIP — риск-монетка ⭐\n\n🎲 ПРАВИЛА:\n1. Сделай ставку и выбери сторону (Орёл/Решка).\n2. Если выиграл → можешь ЗАБРАТЬ выигрыш или КРУТИТЬ ДАЛЬШЕ.\n3. При КРУТИТЬ ДАЛЬШЕ множитель растёт, но при проигрыше теряешь ВСЁ.\n4. Комиссия 5% уже учтена.\n\n🎵 Звук включается после первого касания.\n💾 Прогресс сохраняется автоматически.`);
    });

    // Инициализация
    setChoice("ОРЕЛ");
    loadGame();
    updateBalanceUI();
    updateBetUI();
    if (riskActive) {
        riskPanel.style.display = 'block';
        currentMultiplierSpan.innerText = currentRiskMultiplier.toFixed(2) + 'x';
        playBtn.disabled = true;
        playBtn.style.opacity = '0.5';
    }
</script>
